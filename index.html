<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RubyJ Markdown Editor</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e11d48' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 3h12l4 6-10 13L2 9Z'/%3E%3C/svg%3E">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css"
    />
    <link
      id="hljs-theme"
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown.min.css"
    />
    <link rel="stylesheet" href="/assets/styles.css" />
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = { darkMode: 'class' };
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
      const storedTheme = localStorage.getItem('theme');
      if (storedTheme === 'dark' || (!storedTheme && prefersDark.matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar flex justify-between items-center px-4 sm:px-6 py-4 border-b border-slate-200 dark:border-slate-700 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md transition-colors duration-300">
        <h1 class="text-xl font-bold text-slate-900 dark:text-white tracking-tight">
          <a href="/" class="flex items-center gap-2 hover:text-rose-600 dark:hover:text-rose-400 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 text-rose-600 dark:text-rose-500"><path d="M6 3h12l4 6-10 13L2 9Z"/></svg>
            <span class="hidden sm:inline">RubyJ Markdown Editor</span>
            <span class="sm:hidden">RubyJ</span>
          </a>
        </h1>
        <div class="toolbar-actions flex items-center gap-2 sm:gap-3">
          <button type="button" id="themeToggleBtn" class="p-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 dark:text-slate-400 dark:hover:text-white dark:hover:bg-slate-700 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-rose-500" aria-label="Toggle theme">
            <span id="themeIcon" class="inline-flex w-5 h-5"></span>
          </button>
          <div class="h-6 w-px bg-slate-200 dark:bg-slate-700 mx-1"></div>
          <button type="button" id="copyEncodedBtn" class="flex items-center gap-1.5 px-3 py-2 text-sm font-medium text-slate-700 dark:text-white bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-600 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:ring-offset-2 dark:focus:ring-offset-slate-800 transition-all shadow-sm" aria-label="Copy URL with encoded content">
            <i data-lucide="link" class="w-4 h-4"></i><span class="hidden sm:inline">Copy Link</span>
          </button>
          <button type="button" id="saveBtn" class="flex items-center gap-1.5 px-3 py-2 text-sm font-medium text-white bg-emerald-600 border border-emerald-500 rounded-lg hover:bg-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 dark:focus:ring-offset-slate-800 transition-all shadow-sm shadow-emerald-900/20" aria-label="Save current content locally">
            <i data-lucide="save" class="w-4 h-4"></i><span class="hidden sm:inline">Save</span>
          </button>
          <button type="button" id="clearBtn" class="flex items-center gap-1.5 px-3 py-2 text-sm font-medium text-rose-700 dark:text-rose-100 bg-rose-50 dark:bg-rose-900/50 border border-rose-200 dark:border-rose-800/50 rounded-lg hover:bg-rose-100 dark:hover:bg-rose-800/80 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:ring-offset-2 dark:focus:ring-offset-slate-800 transition-all" aria-label="Clear all content">
            <i data-lucide="trash-2" class="w-4 h-4"></i><span class="hidden sm:inline">Clear</span>
          </button>
        </div>
      </header>

      <nav class="tabbar flex p-2 gap-2 border-b border-slate-200 dark:border-slate-700/50 bg-slate-50 dark:bg-slate-800/40 transition-colors duration-300" aria-label="View mode tabs" role="tablist">
        <button type="button" data-tab-target="editor" class="tab active flex items-center justify-center gap-2 flex-1 py-2.5 px-4 text-sm font-semibold rounded-md transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-rose-500 bg-transparent text-slate-600 hover:bg-slate-200 dark:text-slate-300 dark:hover:bg-slate-700 aria-selected:bg-rose-600 aria-selected:text-white dark:aria-selected:bg-rose-600 shadow-sm" role="tab" aria-selected="true" aria-controls="editorPanel">
          <i data-lucide="edit-3" class="w-4 h-4"></i> Editor
        </button>
        <button type="button" data-tab-target="preview" class="tab flex items-center justify-center gap-2 flex-1 py-2.5 px-4 text-sm font-semibold rounded-md transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-rose-500 bg-transparent text-slate-600 hover:bg-slate-200 dark:text-slate-300 dark:hover:bg-slate-700 aria-selected:bg-rose-600 aria-selected:text-white dark:aria-selected:bg-rose-600 shadow-sm" role="tab" aria-selected="false" aria-controls="previewPanel">
          <i data-lucide="layout-template" class="w-4 h-4"></i> Preview
        </button>
      </nav>

      <section class="panel-wrap flex-1 min-h-0 relative">
        <div id="previewToolbar" class="preview-toolbar hidden absolute top-4 right-8 z-50 flex items-center gap-2 p-2 bg-white/90 dark:bg-slate-800/90 backdrop-blur border border-slate-200 dark:border-slate-700 rounded-xl shadow-lg transition-all duration-300">
          <div class="preview-controls-row">
            <button type="button" id="previewZoomOut" class="p-1.5 text-slate-600 dark:text-slate-300 hover:text-rose-600 dark:hover:text-rose-400 rounded transition-colors" aria-label="Zoom Out">
              <i data-lucide="minus" class="w-4 h-4"></i>
            </button>
            <span id="previewZoomLevel" class="text-xs font-mono text-slate-500 dark:text-slate-400 flex items-center min-w-[3ch] justify-center">100%</span>
            <button type="button" id="previewZoomIn" class="p-1.5 text-slate-600 dark:text-slate-300 hover:text-rose-600 dark:hover:text-rose-400 rounded transition-colors" aria-label="Zoom In">
              <i data-lucide="plus" class="w-4 h-4"></i>
            </button>
            <div class="w-px h-4 bg-slate-200 dark:bg-slate-700 mx-1 self-center"></div>
            <button type="button" id="previewFullscreenBtn" class="p-1.5 text-slate-600 dark:text-slate-300 hover:text-rose-600 dark:hover:text-rose-400 rounded transition-colors" aria-label="Toggle Fullscreen">
              <i data-lucide="maximize" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
        <section id="editorPanel" class="panel active absolute inset-0 transition-opacity duration-300" role="tabpanel" aria-labelledby="editorTab">
          <textarea id="markdownInput" aria-label="Markdown input area" class="w-full h-full bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 p-4 border-none focus:ring-0 resize-none font-mono transition-colors duration-300"></textarea>
        </section>
        <section id="previewPanel" class="panel absolute inset-0 opacity-0 pointer-events-none transition-opacity duration-300 overflow-y-auto p-6 lg:p-10 bg-slate-50 dark:bg-slate-900/50 transition-colors duration-300" role="tabpanel" aria-labelledby="previewTab" hidden>
          <article id="previewOutput" class="markdown-body max-w-4xl mx-auto prose dark:prose-invert prose-slate prose-headings:text-slate-900 dark:prose-headings:text-white prose-a:text-rose-600 dark:prose-a:text-rose-400 hover:prose-a:text-rose-500 dark:hover:prose-a:text-rose-300 prose-pre:bg-slate-100 dark:prose-pre:bg-slate-800 prose-pre:border prose-pre:border-slate-200 dark:prose-pre:border-slate-700 prose-img:rounded-xl transition-colors duration-300"></article>
        </section>
      </section>
    </main>

    <footer class="fixed bottom-0 left-0 right-0 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 py-3 px-6 transition-colors duration-500 ease-in-out z-30">
      <div class="container mx-auto flex justify-between items-center max-w-7xl">
        <div class="flex items-center space-x-2 text-sm font-medium">
          <span class="group relative cursor-pointer hover:text-slate-900 dark:hover:text-white transition-colors">
            <span id="footerYearText">&copy; 2025</span>
            <div class="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-3 opacity-0 group-hover:opacity-100 transition-all duration-200 pointer-events-none">
              <div class="relative bg-slate-800 dark:bg-white text-white dark:text-slate-900 text-xs px-3 py-2 rounded-xl shadow-xl text-center w-28 font-semibold tracking-wide whitespace-nowrap">
                <div class="flex flex-col gap-0.5">
                  <span>made with ❤️‍🔥</span>
                  <span class="text-slate-300 dark:text-slate-600">for SKPF</span>
                </div>
                <div class="absolute h-2 w-2 transform rotate-45 left-1/2 -translate-x-1/2 -bottom-1 bg-slate-800 dark:bg-white"></div>
              </div>
            </div>
          </span>
          <span class="text-slate-300 dark:text-slate-700">|</span>
          <a href="https://github.com/rjmolina13" target="_blank" class="hover:text-rose-600 dark:hover:text-rose-400 transition-colors duration-200">@rjmolina13</a>
        </div>
        <div class="flex items-center space-x-2">
          <svg class="w-4 h-4 text-emerald-500 dark:text-emerald-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3h12l4 6-10 13L2 9Z"/>
          </svg>
          <span id="footerVersionText" class="font-mono text-sm text-slate-500 dark:text-slate-400 transition-colors duration-300 rainbow-hover"></span>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
